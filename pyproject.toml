[project]
name = "micro-llm"
version = "0.1.0"
description = "Mini-applications spécialisées avec un petit modèle de langage exécuté 100 % en local"
readme = "README.md"
license = "AGPL-3.0-only"
requires-python = ">=3.14,<3.15"
dependencies = [
    "pydantic>=2.12",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "ruff>=0.7",
  "mypy>=1.12",
  "bandit>=1.7",
  "pip-audit>=2.7",
]

[tool.hatch.build.targets.wheel]
packages = ["src/micro_llm"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.14"
strict = true
mypy_path = "src"
explicit_package_bases = true

[tool.bandit]
exclude_dirs = [".venv", "tests"]
